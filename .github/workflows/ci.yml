name: CI

# 一键跑完 lint + build + test + examples + 错误码一致性。
# 对应 AGENTS.md §28 的 Definition of Done 中可机器验证的那几条。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 取消同分支上被新提交取代的旧 run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + build + test + examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # biome ci 同时守住代码问题与格式（全仓已格式化一次，见 biome.json）。
      - name: Lint + format
        run: npx biome ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # 覆盖率报告作为 workflow artifact 存档（Node 内建，零新增依赖）。
      - name: Coverage report
        if: runner.os == 'Linux'
        run: npx tsx --test --experimental-test-coverage tests/*.test.ts > coverage-report.txt

      - name: Upload coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report.txt

      # 重新生成示例并确认与仓库内已提交的版本逐字节一致：
      # 示例是文档与回归基线的一部分，悄悄漂移比测试失败更危险。
      - name: Examples match committed artifacts
        run: |
          npm run examples -- --out .ci-examples
          npx tsx scripts/verify-examples.ts .ci-examples examples

      # 错误码文档与源码不一致时失败（scripts/generate-error-codes.ts --check）
      - name: Error-code doc in sync
        run: npm run error-codes -- --check

      # Golden-image 门禁需要真实 renderer（draw.io Desktop），CI runner 上没有——
      # 脚本会显式跳过并说明原因，而不是静默通过。本地与带 renderer 的 runner 才跑。
      - name: Visual golden gate (skip when no renderer)
        run: |
          sudo apt-get install -y draw.io 2>/dev/null \
            || echo "::warning::draw.io Desktop unavailable; the golden-image gate is skipped, not passed"
          npm run visual-gate

  windows:
    # 平台相关代码（draw.io Desktop 安装路径探测、Windows 特有的 EPERM/盘根守卫）
    # 只在 ubuntu 上测不到——这里守 lint/build/test；示例逐字节比对与视觉门禁
    # 依赖 checkout 换行符与真实 renderer，仍归 ubuntu job。
    name: lint + build + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint + format
        run: npx biome ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
